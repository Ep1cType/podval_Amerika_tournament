<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бильярдный турнир</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #161820;
      --surface2:  #1e2130;
      --border:    #2a2d3a;
      --border2:   #3d4260;
      --text:      #e8e8e8;
      --muted:     #6b7280;
      --subtle:    #9ca3af;
      --gold:      #c9a227;
      --gold-bg:   #1a1500;
      --green:     #34d399;
      --red:       #f87171;
      --corona:    #c9a227;
      --corona-bg: #1a1500;
      --america:   #3b82f6;
      --america-bg:#0d1a2e;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      position: sticky; top: 0; z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-right: auto; }
    .logo-icon { width: 34px; height: 34px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    .logo-text h1 { font-size: 15px; font-weight: 600; color: #fff; line-height: 1.2; }
    .logo-text p  { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .header-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    /* ── BUTTONS ── */
    .btn { padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface2); color: #c8cacc; font-size: 12px; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; line-height: 1; }
    .btn:hover { background: #252840; border-color: var(--border2); color: #fff; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.danger { background: #3a1a1a; border-color: #6b2020; color: var(--red); }
    .btn.danger:hover { background: #4a2020; }
    .import-input { display: none; }

    /* ── AUTH BADGE ── */
    .auth-badge { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border); font-size: 11px; font-weight: 500; white-space: nowrap; }
    .auth-badge.admin { border-color: #c9a22740; background: var(--gold-bg); color: var(--gold); }
    .auth-badge.viewer { color: var(--muted); }
    .auth-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    /* ── INLINE LOGIN ── */
    .login-input { padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border); background: #0f1117; color: var(--text); font-size: 12px; outline: none; transition: border-color .15s; font-family: inherit; }
    .login-input:focus { border-color: var(--gold); }
    .login-error { font-size: 11px; color: var(--red); white-space: nowrap; }
    #loginStepPw, #loginStepToken { display: none; align-items: center; gap: 6px; flex-wrap: wrap; }

    /* ── SYNC ── */
    .sync-status { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); white-space: nowrap; }
    .sync-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .sync-dot.ok      { background: var(--green); }
    .sync-dot.err     { background: var(--red); }
    .sync-dot.loading { background: var(--gold); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── MAIN ── */
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }

    /* ── STATS ── */
    .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 18px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
    .stat-value { font-size: 22px; font-weight: 700; color: #fff; }
    .stat-value.gold { color: var(--gold); }
    .stat-value small { font-size: 13px; color: var(--muted); font-weight: 400; }

    /* ── DISCIPLINE TABS ── */
    .disc-tabs { display: flex; gap: 0; margin-bottom: 18px; border-radius: 9px; overflow: hidden; border: 1px solid var(--border); width: fit-content; }
    .disc-tab { padding: 8px 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: var(--surface2); color: var(--muted); transition: all .15s; white-space: nowrap; }
    .disc-tab:first-child { border-right: 1px solid var(--border); }
    .disc-tab.active-corona   { background: var(--corona-bg); color: var(--corona); }
    .disc-tab.active-america  { background: var(--america-bg); color: var(--america); }
    .disc-tab.active-combined { background: #1a1a2e; color: #a78bfa; }

    /* ── STANDINGS TABLE ── */
    .section-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .section-label::after { content:''; flex: 1; height: 1px; background: var(--border); }

    .sort-pills { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
    .sort-pill { padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--subtle); font-size: 11px; cursor: pointer; transition: all .12s; }
    .sort-pill:hover { border-color: var(--border2); color: var(--text); }
    .sort-pill.active { border-color: #c9a22750; color: var(--gold); background: var(--gold-bg); }

    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 20px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; min-width: 540px; }
    thead th { background: #1a1d2e; color: var(--subtle); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
    thead th:hover { color: var(--text); }
    thead th.c { text-align: center; }
    tbody tr { border-bottom: 1px solid #1a1c28; transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #1c1f2e; }
    tbody td { padding: 10px 12px; vertical-align: middle; }
    tbody td.c { text-align: center; }

    .rank { font-size: 12px; font-weight: 700; color: var(--muted); min-width: 20px; }
    .rank.r1 { color: var(--gold); }
    .rank.r2 { color: var(--subtle); }
    .rank.r3 { color: #cd7f32; }
    .pname { font-weight: 500; white-space: nowrap; }
    .pts-main { font-size: 17px; font-weight: 700; color: var(--gold); }
    .sub-pts { display: flex; flex-direction: column; gap: 1px; }
    .sub-pt  { font-size: 10px; display: flex; align-items: center; gap: 3px; }
    .disc-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .diff-pos { color: var(--green); font-weight: 600; }
    .diff-neg { color: var(--red); font-weight: 600; }
    .diff-zero { color: var(--muted); }
    .pct-wrap { display: inline-flex; align-items: center; gap: 5px; }
    .pct-bar  { width: 40px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .pct-fill { height: 100%; background: var(--gold); border-radius: 2px; }
    .wdl { display: flex; gap: 3px; justify-content: center; }
    .wdl span { font-size: 11px; min-width: 16px; text-align: center; }
    .duel-marker { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #a78bfa; margin-left: 3px; vertical-align: middle; title: 'Дуэль'; }

    /* ── MATCHES SECTION ── */
    .matches-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .matches-title { font-size: 14px; font-weight: 600; }

    .disc-switch { display: flex; gap: 0; border-radius: 7px; overflow: hidden; border: 1px solid var(--border); }
    .disc-sw-btn { padding: 5px 14px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; background: var(--surface2); color: var(--muted); transition: all .15s; }
    .disc-sw-btn:first-child { border-right: 1px solid var(--border); }
    .disc-sw-btn.on-corona   { background: var(--corona-bg); color: var(--corona); }
    .disc-sw-btn.on-america  { background: var(--america-bg); color: var(--america); }

    .round-tabs { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 12px; }
    .round-tab { padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface2); color: var(--subtle); font-size: 11px; font-weight: 500; cursor: pointer; transition: all .1s; }
    .round-tab:hover { border-color: var(--border2); color: var(--text); }
    .round-tab.active-corona   { background: var(--corona-bg); border-color: var(--corona); color: var(--corona); font-weight: 700; }
    .round-tab.active-america  { background: var(--america-bg); border-color: var(--america); color: var(--america); font-weight: 700; }
    .round-tab.done { border-color: #34d39940; color: var(--green); }
    .round-tab.active-corona.done  { background: var(--corona-bg); border-color: var(--corona); color: var(--corona); }
    .round-tab.active-america.done { background: var(--america-bg); border-color: var(--america); color: var(--america); }

    .matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 8px; }

    .match-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; }
    .match-card.done-corona   { border-color: #c9a22730; background: #1a1700; }
    .match-card.done-america  { border-color: #3b82f630; background: #0d1525; }
    .match-card.duel-highlight { position: relative; }
    .match-card.duel-highlight::before { content:''; position:absolute; inset:0; border-radius:9px; border:1px solid #a78bfa40; pointer-events:none; }

    .match-players { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .mp { font-size: 12px; font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mp.right { text-align: right; }
    .mvs { font-size: 10px; color: var(--muted); font-weight: 600; flex-shrink: 0; }

    .match-score { display: flex; align-items: center; gap: 6px; }
    .score-inp { width: 42px; padding: 4px 5px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; font-weight: 600; text-align: center; outline: none; transition: border-color .15s; -moz-appearance: textfield; }
    .score-inp::-webkit-inner-spin-button, .score-inp::-webkit-outer-spin-button { -webkit-appearance: none; }
    .score-inp[id*="corona"]:focus { border-color: var(--gold); }
    .score-inp[id*="america"]:focus { border-color: var(--america) !important; }
    .score-sep { font-size: 13px; color: var(--muted); font-weight: 600; flex-shrink: 0; }
    .score-ro { width: 42px; text-align: center; font-size: 14px; font-weight: 600; }
    .score-ro.winner { color: var(--gold); }
    .match-save-btn { margin-left: auto; padding: 4px 9px; border-radius: 5px; border: 1px solid var(--border); background: transparent; color: var(--subtle); font-size: 11px; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .match-save-btn:hover { border-color: var(--gold); color: var(--gold); }
    .match-done-lbl { font-size: 10px; color: var(--green); margin-left: auto; font-weight: 500; white-space: nowrap; }
    .match-edit-btn { padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 10px; cursor: pointer; margin-left: 3px; }
    .match-edit-btn:hover { color: var(--gold); border-color: var(--gold); }
    .match-not-played { font-size: 10px; color: var(--muted); margin-left: auto; }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 9px 16px; border-radius: 8px; font-size: 12px; font-weight: 500; opacity: 0; transition: opacity .3s; z-index: 999; pointer-events: none; max-width: 300px; }
    .toast.show { opacity: 1; }
    .toast.ok  { border-color: #34d39940; color: var(--green); }
    .toast.err { border-color: #f8717140; color: var(--red); }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      .stats-row { grid-template-columns: repeat(2,1fr); gap: 8px; }
      .stat-card { padding: 11px 13px; }
      .stat-value { font-size: 18px; }
      header { padding: 10px 12px; gap: 8px; }
      .logo-text p { display: none; }
      .wrap { padding: 10px; }
      .matches-grid { grid-template-columns: 1fr; }
      .auth-badge span { display: none; }
      .sync-status span { display: none; }
      /* keep table scrollable */
      table { min-width: 480px; }
      /* hide sub-points column on mobile to save space */
      .col-subpts { display: none; }
    }
    @media (max-width: 380px) {
      .disc-tabs { width: 100%; }
      .disc-tab  { flex: 1; text-align: center; padding: 7px 8px; font-size: 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🎱</div>
    <div class="logo-text">
      <h1>Бильярдный турнир</h1>
      <p>Корона &amp; Америка · 14 игроков · 13 туров</p>
    </div>
  </div>

  <div class="sync-status">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncText">Загрузка...</span>
  </div>

  <div class="auth-badge viewer" id="authBadge">
    <div class="auth-dot"></div>
    <span>Просмотр</span>
  </div>

  <!-- Шаг 1: пароль -->
  <div id="loginStepPw">
    <input class="login-input" type="password" id="authPassword" placeholder="Пароль" style="width:110px" onkeydown="if(event.key==='Enter')checkPassword()">
    <span class="login-error" id="pwError" style="display:none"></span>
    <button class="btn" style="background:var(--gold-bg);border-color:var(--gold);color:var(--gold)" onclick="checkPassword()">→</button>
    <button class="btn" onclick="cancelLogin()">✕</button>
  </div>

  <!-- Шаг 2: токен -->
  <div id="loginStepToken">
    <input class="login-input" type="password" id="authToken" placeholder="ghp_токен" style="width:190px" onkeydown="if(event.key==='Enter')loginWithToken()">
    <span class="login-error" id="tokenError" style="display:none"></span>
    <button class="btn" style="background:var(--gold-bg);border-color:var(--gold);color:var(--gold)" id="loginSubmitBtn" onclick="loginWithToken()">Войти</button>
    <button class="btn" onclick="cancelLogin()">✕</button>
  </div>

  <!-- Публичные кнопки -->
  <div id="publicActions" class="header-actions">
    <button class="btn" onclick="exportExcel()">⬇ Excel</button>
    <button class="btn" onclick="showLoginForm()">Войти</button>
  </div>

  <!-- Кнопки администратора -->
  <div id="adminActions" class="header-actions" style="display:none">
    <button class="btn" onclick="exportExcel()">⬇ Excel</button>
    <label class="btn" style="cursor:pointer">⬆ Импорт<input type="file" class="import-input" accept=".xlsx,.xls" onchange="importExcel(event)"></label>
    <button class="btn danger" onclick="resetData()">↺ Сброс</button>
    <button class="btn" onclick="logout()">Выйти</button>
  </div>
</header>

<div class="wrap">

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Сыграно матчей</div>
      <div class="stat-value" id="s-played">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Всего матчей</div>
      <div class="stat-value">182</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Игроков</div>
      <div class="stat-value">14</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Лидер</div>
      <div class="stat-value gold" style="font-size:14px;margin-top:4px" id="s-leader">—</div>
    </div>
  </div>

  <!-- STANDINGS -->
  <div class="section-label">Турнирная таблица</div>

  <!-- Фильтр по дисциплине в таблице -->
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">
    <div class="disc-tabs" id="tableDisc">
      <button class="disc-tab active-combined" data-disc="combined" onclick="setTableDisc('combined')">Общая</button>
      <button class="disc-tab" data-disc="corona"   onclick="setTableDisc('corona')">🔶 Корона</button>
      <button class="disc-tab" data-disc="america"  onclick="setTableDisc('america')">🔷 Америка</button>
    </div>
    <div class="sort-pills" id="sortPills">
      <button class="sort-pill active" onclick="setSort('pts')">По очкам</button>
      <button class="sort-pill" onclick="setSort('diff')">По разнице</button>
      <button class="sort-pill" onclick="setSort('wins')">По победам</button>
      <button class="sort-pill" onclick="setSort('name')">А–Я</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
      <tr>
        <th style="width:28px">#</th>
        <th onclick="setSort('name')">Игрок</th>
        <th class="c" onclick="setSort('games')">Игр</th>
        <th class="c" onclick="setSort('wins')" style="color:#34d39980">В</th>
        <th class="c" onclick="setSort('draws')">Н</th>
        <th class="c" onclick="setSort('losses')" style="color:#f8717180">П</th>
        <th class="c" onclick="setSort('pts')">Очки</th>
        <th class="c col-subpts" id="thSubPts" onclick="setSort('pts')">К / А</th>
        <th class="c" onclick="setSort('diff')">Разница</th>
        <th class="c">% побед</th>
      </tr>
      </thead>
      <tbody id="standingsBody"></tbody>
    </table>
  </div>

  <!-- MATCHES -->
  <div class="matches-header">
    <div class="matches-title">Матчи</div>
    <div class="disc-switch" id="matchDisc">
      <button class="disc-sw-btn on-corona" data-disc="corona" onclick="setMatchDisc('corona')">🔶 Корона</button>
      <button class="disc-sw-btn" data-disc="america" onclick="setMatchDisc('america')">🔷 Америка</button>
    </div>
  </div>

  <div class="round-tabs" id="roundTabs"></div>
  <div class="matches-grid" id="matchesGrid"></div>

</div>

<div class="toast" id="toast"></div>

<script>

function mkey(disc, ri, mi) { return disc + '_' + ri + '_' + mi; }
function getRes(disc, ri, mi) { return results[mkey(disc, ri, mi)] || {s1:'', s2:'', done:false}; }

function ghHeaders() { return {'Authorization':'token '+ghToken,'Content-Type':'application/json'}; }

async function loadFromGitHub() {
  setSyncState('loading','Загрузка...');
  try {
    const url = 'https://api.github.com/repos/'+CONFIG.GITHUB_OWNER+'/'+CONFIG.GITHUB_REPO+'/contents/'+CONFIG.RESULTS_FILE;
    const r = await fetch(url, { headers: ghToken ? ghHeaders() : {} });
    if (r.status === 404) { results={}; fileSha=''; setSyncState('ok','Новый файл'); renderAll(); return; }
    if (!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    fileSha  = data.sha;
    results  = JSON.parse(atob(data.content.replace(/\n/g,'')));
    setSyncState('ok','Синхронизировано');
    renderAll();
  } catch(e) { setSyncState('err','Ошибка загрузки'); showToast('Не удалось загрузить: '+e.message,'err'); renderAll(); }
}

async function saveToGitHub() {
  if (!ghToken) { showToast('Нет токена','err'); return false; }
  setSyncState('loading','Сохранение...');
  try {
    const url  = 'https://api.github.com/repos/'+CONFIG.GITHUB_OWNER+'/'+CONFIG.GITHUB_REPO+'/contents/'+CONFIG.RESULTS_FILE;
    const body = { message:'update results', content: btoa(unescape(encodeURIComponent(JSON.stringify(results,null,2)))) };
    if (fileSha) body.sha = fileSha;
    const r = await fetch(url, {method:'PUT', headers:ghHeaders(), body:JSON.stringify(body)});
    if (!r.ok) { const e=await r.json(); throw new Error(e.message||'HTTP '+r.status); }
    const data = await r.json();
    fileSha = data.content.sha;
    setSyncState('ok','Сохранено ✓');
    return true;
  } catch(e) { setSyncState('err','Ошибка'); showToast('Ошибка сохранения: '+e.message,'err'); return false; }
}

function setSyncState(st,txt) {
  document.getElementById('syncDot').className = 'sync-dot '+st;
  document.getElementById('syncText').textContent = txt;
}

async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function showLoginForm() {
  document.getElementById('publicActions').style.display  = 'none';
  document.getElementById('loginStepPw').style.display    = 'flex';
  document.getElementById('loginStepToken').style.display = 'none';
  document.getElementById('authPassword').value = '';
  document.getElementById('pwError').style.display = 'none';
  setTimeout(()=>document.getElementById('authPassword').focus(),50);
}

}
async function checkPassword() {
  const pw   = document.getElementById('authPassword').value;
  const hash = await sha256(pw);
  const errEl = document.getElementById('pwError');
  if (hash !== CONFIG.ADMIN_PASSWORD_HASH) { errEl.textContent='Неверный пароль'; errEl.style.display='inline'; return; }
  errEl.style.display='none';

}
async function loginWithToken() {
  const token  = document.getElementById('authToken').value.trim();
  const errEl  = document.getElementById('tokenError');

  if (!token) { errEl.textContent='Введите токен'; errEl.style.display='inline'; return; }
  btn.textContent='...'; btn.disabled=true;
  try {

    localStorage.setItem(LS_TOKEN, token);

//  РАСЧЁТ ОЧКОВ
// ══════════════════════════════════════
function calcStats(disc) {
  // Считает статистику по одной дисциплине или обеим
  const st = {};
  PLAYERS.forEach(p => { st[p] = {name:p, games:0, wins:0, draws:0, losses:0, pts:0, scored:0, conceded:0}; });
  const discs = disc==='combined' ? DISCS : [disc];
  discs.forEach(d => {
    SCHEDULE.forEach((round, ri) => {
      round.forEach((match, mi) => {
        const res = getRes(d, ri, mi);
        if (!res.done) return;
        const [p1,p2] = match;
        const s1=+res.s1, s2=+res.s2;
        if (isNaN(s1)||isNaN(s2)) return;
        st[p1].games++; st[p2].games++;
        st[p1].scored+=s1; st[p1].conceded+=s2;
        st[p2].scored+=s2; st[p2].conceded+=s1;
        if (s1>s2)      { st[p1].wins++; st[p1].pts+=3; st[p2].losses++; }
        else if (s2>s1) { st[p2].wins++; st[p2].pts+=3; st[p1].losses++; }
        else            { st[p1].draws++; st[p1].pts++; st[p2].draws++; st[p2].pts++; }
      });
    });
  });
  return Object.values(st);
}

// Находит все пары (игрок A, игрок B) где есть ничья в дуэли (корона и америка):
// A выиграл у B в одной дисциплине, B выиграл у A в другой.
// Возвращает Set строк вида "ИмяA|ИмяB" (упорядоченных).
// Очки игрока pA в личных встречах с pB (корона + америка)
function h2hPoints(pA, pB) {
  let pts = 0;
  DISCS.forEach(d => {
    SCHEDULE.forEach((round,ri) => {
      round.forEach((match,mi) => {
        const [m0,m1] = match;
        if (!((m0===pA&&m1===pB)||(m0===pB&&m1===pA))) return;
        const res = getRes(d,ri,mi);
        if (!res.done) return;
        const sA = m0===pA ? +res.s1 : +res.s2;
        const sB = m0===pA ? +res.s2 : +res.s1;
        if (sA > sB) pts += 3;
        else if (sA === sB) pts += 1;
      });
    });
  });
  return pts;
}

// Разница партий в личных встречах A vs B (с т.з. pA, по всем дисциплинам)
function h2hDiff(pA, pB) {
  let diff = 0;
  DISCS.forEach(d => {
    SCHEDULE.forEach((round,ri) => {
      round.forEach((match,mi) => {
        const [m0,m1] = match;
        if (!((m0===pA&&m1===pB)||(m0===pB&&m1===pA))) return;
        const res = getRes(d,ri,mi);
        if (!res.done) return;
        const sA = m0===pA ? +res.s1 : +res.s2;
        const sB = m0===pA ? +res.s2 : +res.s1;
        diff += (sA - sB);
      });
    });
  });
  return diff;
}

// Есть ли хотя бы один сыгранный матч между A и B
function h2hPlayed(pA, pB) {
  return DISCS.some(d =>
          SCHEDULE.some((round,ri) =>
                  round.some((match,mi) => {
                    const [m0,m1] = match;
                    if (!((m0===pA&&m1===pB)||(m0===pB&&m1===pA))) return false;
                    return getRes(d,ri,mi).done;
                  })
          )
  );
}

// Игроки у которых есть личная встреча с неравными очками — помечаем для UI
function findH2HAdvantage() {
  const marked = new Set();
  for (let i=0;i<PLAYERS.length;i++) {
    for (let j=i+1;j<PLAYERS.length;j++) {
      const pA=PLAYERS[i], pB=PLAYERS[j];
      if (!h2hPlayed(pA,pB)) continue;
      const ptsA = h2hPoints(pA,pB);
      const ptsB = h2hPoints(pB,pA);
      if (ptsA !== ptsB) {
        marked.add(pA); marked.add(pB);
      }
    }
  }
  return marked;
}

function sortedStandings(data) {
  return [...data].sort((a,b) => {
    if (sortBy==='name')   return a.name.localeCompare(b.name,'ru');
    if (sortBy==='wins')   return b.wins-a.wins || b.pts-a.pts;
    if (sortBy==='draws')  return b.draws-a.draws;
    if (sortBy==='losses') return a.losses-b.losses;
    if (sortBy==='games')  return b.games-a.games;

    // Основная сортировка: очки
    const ptsDiff = b.pts - a.pts;
    if (ptsDiff !== 0) return ptsDiff;

    // Равные очки → 1) очки в личных встречах
    if (h2hPlayed(a.name, b.name)) {
      const h2hA = h2hPoints(a.name, b.name);
      const h2hB = h2hPoints(b.name, a.name);
      if (h2hA !== h2hB) return h2hB - h2hA; // больше очков в личке — выше
    }

    // 2) Разница партий во всех матчах
    const gDiff = (b.scored-b.conceded) - (a.scored-a.conceded);
    if (gDiff !== 0) return gDiff;

    // 3) Количество побед
    return b.wins - a.wins;
  });
}

function setTableDisc(disc) {
  tableDisc = disc;
  document.querySelectorAll('#tableDisc .disc-tab').forEach(b => {
    b.className = 'disc-tab' + (b.dataset.disc===disc ? (' active-'+disc) : '');

  document.getElementById('thSubPts').style.display = disc==='combined' ? '' : 'none';

function setSort(by) {
  sortBy = by;
  document.querySelectorAll('.sort-pill').forEach(b => b.classList.remove('active'));
  const pills = document.querySelectorAll('.sort-pill');
  const map = ['pts','diff','wins','name'];
  pills.forEach((b,i) => { if(map[i]===by) b.classList.add('active'); });
  renderStandings();

function renderStandings() {
  const data = calcStats(tableDisc);
  const sorted = sortedStandings(data);
  const h2hMarked = findH2HAdvantage();

  // Sub-pts (только для combined)
  const cData = tableDisc==='combined' ? calcStats('corona')  : null;
  const aData = tableDisc==='combined' ? calcStats('america') : null;
  const cMap  = cData ? Object.fromEntries(cData.map(p=>[p.name,p])) : null;
  const aMap  = aData ? Object.fromEntries(aData.map(p=>[p.name,p])) : null;

  // Подсчёт статистики шапки
  let totalDone = 0;
  DISCS.forEach(d => SCHEDULE.forEach((r,ri) => r.forEach((_,mi) => { if(getRes(d,ri,mi).done) totalDone++; })));
  document.getElementById('s-played').innerHTML = totalDone + ' <small>/ 182</small>';
  const leader = sorted.find(p=>p.games>0);
  document.getElementById('s-leader').innerHTML = leader
          ? leader.name.split(' ')[0] + ' <small>' + leader.pts + ' оч.</small>'
          : '—';

  document.getElementById('standingsBody').innerHTML = sorted.map((p,i) => {
    const diff  = p.scored-p.conceded;
    const dStr  = diff>0?'+'+diff:''+diff;
    const dCls  = diff>0?'diff-pos':diff<0?'diff-neg':'diff-zero';
    const pct   = p.games>0 ? Math.round(p.wins/p.games*100) : 0;
    const rnk   = i===0?'r1':i===1?'r2':i===2?'r3':'';

    // Пометить если у этого игрока есть личное преимущество над кем-то с теми же очками
    const hasH2H = h2hMarked.has(p.name);

    const subPts = tableDisc==='combined' && cMap
            ? '<td class="c col-subpts"><span style="color:var(--corona);font-size:11px">' + (cMap[p.name]?.pts||0) + '</span> / <span style="color:var(--america);font-size:11px">' + (aMap[p.name]?.pts||0) + '</span></td>'
            : '<td class="c col-subpts" style="display:none"></td>';

    return '<tr>' +
            '<td class="rank '+rnk+'">' + (i+1) + '</td>' +
            '<td class="pname">' + p.name + (hasH2H?'<span class="duel-marker" title="Учтены личные встречи"></span>':'') + '</td>' +
            '<td class="c" style="color:var(--subtle)">' + p.games + '</td>' +
            '<td class="c" style="color:var(--green)">' + p.wins + '</td>' +
            '<td class="c" style="color:var(--subtle)">' + p.draws + '</td>' +
            '<td class="c" style="color:var(--red)">' + p.losses + '</td>' +
            '<td class="c pts-main">' + p.pts + '</td>' +
            subPts +
            '<td class="c ' + dCls + '">' + (p.games>0?dStr:'—') + '</td>' +
            '<td class="c"><div class="pct-wrap"><div class="pct-bar"><div class="pct-fill" style="width:'+pct+'%"></div></div><span style="color:var(--subtle);font-size:11px;min-width:28px">' + (p.games>0?pct+'%':'—') + '</span></div></td>' +
            '</tr>';
  }).join('');
}

function renderRoundTabs() {
  document.getElementById('roundTabs').innerHTML = SCHEDULE.map((round,ri) => {
    const done   = round.every((_,mi) => getRes(matchDisc,ri,mi).done);
    const active = ri===curRound;
    const cls    = ['round-tab', active?'active-'+matchDisc:'', done?'done':''].filter(Boolean).join(' ');
    return '<div class="'+cls+'" onclick="selectRound('+ri+')">' + (ri+1) + '</div>';
  }).join('');
}

function selectRound(ri) { curRound=ri; renderRoundTabs(); renderMatches(); }

// Матчи в текущем туре где между игроками есть расхождение в личных очках
function getDuelMatchPairs(disc, ri) {
  const marked = new Set();
  SCHEDULE[ri].forEach(match => {
    if (!h2hPlayed(match[0], match[1])) return;
    const ptsA = h2hPoints(match[0], match[1]);
    const ptsB = h2hPoints(match[1], match[0]);
    if (ptsA !== ptsB) marked.add(match.slice().sort().join('|'));
  });
  return marked;
}

function renderMatches() {
  const disc   = matchDisc;
  const round  = SCHEDULE[curRound];
  const duelMatchPairs = getDuelMatchPairs(disc, curRound);

  document.getElementById('matchesGrid').innerHTML = round.map((match,mi) => {
    const res  = getRes(disc, curRound, mi);
    const key  = mkey(disc, curRound, mi);
    const pairKey = match.slice().sort().join('|');
    const isDuel  = duelMatchPairs.has(pairKey);

    const doneClass = res.done ? 'done-'+disc : '';
    const duelClass = isDuel   ? 'duel-highlight' : '';

    let scoreHtml, actionHtml;
    if (res.done) {
      const s1wins = +res.s1 > +res.s2;
      const s2wins = +res.s2 > +res.s1;
      scoreHtml = '<span class="score-ro'+(s1wins?' winner':'')+'">'+res.s1+'</span><span class="score-sep">:</span><span class="score-ro'+(s2wins?' winner':'')+'">'+res.s2+'</span>';
      actionHtml = '<span class="match-done-lbl">✓</span>' + (isAdmin?'<button class="match-edit-btn" onclick="editMatch(\''+key+'\')">✎</button>':'');
    } else if (isAdmin) {
      scoreHtml = '<input class="score-inp" type="number" min="0" max="99" id="s1_'+key+'" placeholder="0"><span class="score-sep">:</span><input class="score-inp" type="number" min="0" max="99" id="s2_'+key+'" placeholder="0">';
      actionHtml = '<button class="match-save-btn" onclick="saveMatch(\''+key+'\',\''+disc+'\','+curRound+','+mi+')">Сохранить</button>';
    } else {
      scoreHtml = '<span class="score-ro" style="color:var(--muted)">—</span><span class="score-sep">:</span><span class="score-ro" style="color:var(--muted)">—</span>';
      actionHtml = '<span class="match-not-played">не сыгран</span>';
    }

    return '<div class="match-card '+doneClass+' '+duelClass+'">' +
            '<div class="match-players"><span class="mp">'+match[0]+'</span><span class="mvs">vs</span><span class="mp right">'+match[1]+'</span></div>' +
            '<div class="match-score">' + scoreHtml + actionHtml + '</div>' +
            '</div>';
  }).join('');
}

// ══════════════════════════════════════
//  СОХРАНЕНИЕ
// ══════════════════════════════════════
async function saveMatch(key, disc, ri, mi) {
  if (!isAdmin) return;
  const s1el = document.getElementById('s1_'+key);
  const s2el = document.getElementById('s2_'+key);
  if (!s1el||s1el.value===''||s2el.value==='') { showToast('Введите счёт','err'); return; }
  results[key] = {s1:+s1el.value, s2:+s2el.value, done:true};
  renderAll();
  const ok = await saveToGitHub();
  if (ok) showToast('Результат сохранён ✓');
}
function editMatch(key) {
  if (!isAdmin) return;
  if (results[key]) results[key].done = false;
  renderMatches();
}
async function resetData() {
  if (!isAdmin) return;
  if (!confirm('Сбросить ВСЕ результаты? Это действие нельзя отменить.')) return;
  results = {};
  renderAll();
  const ok = await saveToGitHub();
  if (ok) showToast('Все результаты сброшены');
}

// ══════════════════════════════════════
//  EXCEL
// ══════════════════════════════════════
function exportExcel() {
  const wb = XLSX.utils.book_new();

  // Общая таблица
  const combined = sortedStandings(calcStats('combined'));
  const cStats   = Object.fromEntries(calcStats('corona').map(p=>[p.name,p]));
  const aStats   = Object.fromEntries(calcStats('america').map(p=>[p.name,p]));
  const sRows = [['#','Игрок','Игр','В','Н','П','Очки','Очки К','Очки А','Разница','% Побед']];
  combined.forEach((p,i) => {
    const pct = p.games>0?Math.round(p.wins/p.games*100):0;
    sRows.push([i+1,p.name,p.games,p.wins,p.draws,p.losses,p.pts,
      cStats[p.name]?.pts||0, aStats[p.name]?.pts||0,
      p.scored-p.conceded, pct+'%']);
  });
  const ws1 = XLSX.utils.aoa_to_sheet(sRows);
  ws1['!cols'] = [4,22,5,4,4,5,6,6,6,8,8].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws1, 'Таблица');

  // Матчи — оба дисциплины
  DISCS.forEach(disc => {
    const dname = disc==='corona'?'Корона':'Америка';
    const mRows = [['Тур','Игрок 1','Счёт 1','Счёт 2','Игрок 2','Статус']];
    SCHEDULE.forEach((round,ri) => round.forEach((match,mi) => {
      const res = getRes(disc,ri,mi);
      mRows.push([ri+1, match[0], res.done?res.s1:'', res.done?res.s2:'', match[1], res.done?'Завершён':'Не сыгран']);
    }));
    const ws = XLSX.utils.aoa_to_sheet(mRows);
    ws['!cols'] = [5,22,7,7,22,10].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws, dname);
  });

  XLSX.writeFile(wb, 'billiard_tournament.xlsx');
  showToast('Excel скачан ✓');
}

async function importExcel(event) {
  if (!isAdmin) return;
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(e.target.result,{type:'binary'});
      let n = 0;
      DISCS.forEach(disc => {
        const sheetName = disc==='corona'?'Корона':'Америка';
        const ws = wb.Sheets[sheetName]; if (!ws) return;
        const rows = XLSX.utils.sheet_to_json(ws,{header:1});
        rows.slice(1).forEach(row => {
          const [tour,p1,s1,s2,p2,status] = row;
          if (!tour||status!=='Завершён') return;
          const ri = +tour-1;
          const mi = (SCHEDULE[ri]||[]).findIndex(m=>m[0]===p1&&m[1]===p2);
          if (mi===-1) return;
          results[mkey(disc,ri,mi)]={s1:+s1,s2:+s2,done:true}; n++;
        });
      });
      renderAll();
      const ok = await saveToGitHub();
      if (ok) showToast('Импортировано '+n+' матчей ✓');
    } catch(err) { showToast('Ошибка импорта','err'); }
  };
  reader.readAsBinaryString(file);
  event.target.value='';
}

// ══════════════════════════════════════
//  TOAST
// ══════════════════════════════════════
let toastTimer;
function showToast(msg,type) {
  const t = document.getElementById('toast');
  t.textContent=msg; t.className='toast show '+(type||'ok');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

//  RENDER ALL
// ══════════════════════════════════════
function renderAll() { renderStandings(); renderRoundTabs(); renderMatches(); }
